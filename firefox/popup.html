<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<title>SN Assignflow</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="card">
  <div class="card-mark">
    <!-- Distribution fork: one input, two outputs -->
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="4.5" cy="12" r="2.4" fill="#fff" stroke="none"/>
      <path d="M7.4 12h3.1"/>
      <path d="M10.5 12 17.2 5.3"/>
      <path d="M10.5 12 17.2 18.7"/>
      <path d="M13.6 5.3h3.6v3.6"/>
      <path d="M13.6 18.7h3.6v-3.6"/>
    </svg>
  </div>
  <div class="card-text">
    <div class="card-name">SN Assignflow</div>
    <div class="card-ver" id="cardVer">v4.1.1</div>
  </div>
  <button class="icon-btn card-theme" id="btnTheme" type="button"
          title="Switch to dark theme" aria-label="Switch to dark theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4a8.4 8.4 0 1 0 10.5 10.5z"/>
    </svg>
  </button>
</div>

<button id="btnLaunch">
  <svg id="launchIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M8 5.2v13.6L19 12z"/>
  </svg>
  <span id="launchLabel">Launch Widget</span>
</button>

<div id="status">Opens the dispatcher on this tab only.</div>

<div class="summary">
  <div class="summary-cell">
    <div class="summary-val" id="sumGroups">0</div>
    <div class="summary-lbl">Groups</div>
  </div>
  <div class="summary-cell">
    <div class="summary-val" id="sumAgents">0</div>
    <div class="summary-lbl">Agents</div>
  </div>
  <div class="summary-cell">
    <div class="summary-val" id="sumTotal">0</div>
    <div class="summary-lbl">Assigned</div>
  </div>
</div>

<div class="rule" style="margin-top:12px"></div>

<button id="btnConfig">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" aria-hidden="true">
    <path d="M4 7h9"/><path d="M19 7h1"/>
    <path d="M4 17h1"/><path d="M11 17h9"/>
    <circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/>
  </svg>
  <span>Open Configuration</span>
</button>

<div class="foot-links">
  <a class="foot-link" id="btnReportBug"
     href="mailto:contact@davagni.eu.org?subject=SN%20Assignflow%20%E2%80%94%20bug%20report"
     title="Email a bug report, a question or a feature request">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="5.2" width="18" height="13.6" rx="2.2"/>
      <path d="M3.6 6.4 12 12.6l8.4-6.2"/>
    </svg>
    <span>Report a Bug</span>
  </a>

  <button class="foot-link foot-link-support" id="btnSupport" title="Support the project">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 21s-6.716-4.35-9.428-8.06C.86 10.44 1.02 7.2 3.34 5.34 5.4 3.69 8.28 4.06 10 6.02L12 8.3l2-2.28c1.72-1.96 4.6-2.33 6.66-.68 2.32 1.86 2.48 5.1.77 7.6C18.716 16.65 12 21 12 21z"/>
    </svg>
    <span>Support</span>
  </button>
</div>

<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
